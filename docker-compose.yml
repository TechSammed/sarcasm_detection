version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BERT_FALLBACK_ENABLED=false
    # Uncomment to enable BERT fallback with local model weights:
    # volumes:
    #   - ./sarcasm_model:/app/sarcasm_model:ro
    # environment:
    #   - BERT_FALLBACK_ENABLED=true
    #   - BERT_MODEL_PATH=/app/sarcasm_model
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
